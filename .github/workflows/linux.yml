# Linux verification: type-check, unit tests, the build, the host-mode matrix (shells, fake GPUs, download scenarios),
# the TUI smoke variants in a pty, real containers (Docker is preinstalled on ubuntu runners) and an X11 clipboard
# round trip (Xvfb + xclip).
name: linux
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build (verifies the committed bin matches the source)
        run: npm run build && git diff --stat -- bin | tail -3
      - name: Real llama-server end to end
        run: node test/e2e/real-server.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMACLI_DIST: ${{ github.workspace }}/dist
      - name: System packages for the pty smoke test and the X11 clipboard
        run: |
          sudo apt-get update
          sudo apt-get install -y xclip xvfb python3-pip
          pip install pyte
      - name: Host-mode matrix (shells, fake GPUs, cgroup rows when systemd --user is available)
        run: node test/containers/run-host.mjs
      - name: Download scenarios
        run: node test/containers/download-scenario.mjs
      - name: TUI smoke (terminal / HOME variants in a pty)
        run: python3 test/containers/tui-smoke.py
      - name: Containers (Debian, Ubuntu, Fedora, Arch, Alpine/musl + hardware rows)
        run: node test/containers/run-containers.mjs
      - name: X11 clipboard round trip
        run: xvfb-run -a node test/clipboard-check.mjs
      - name: Plain drag copies to the clipboard (X11, xclip)
        run: xvfb-run -a python3 test/tui/drag-copy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: test/containers/results/
          if-no-files-found: ignore
